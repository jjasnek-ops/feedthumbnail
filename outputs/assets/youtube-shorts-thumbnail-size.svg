<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Shorts thumbnail size and upload routes</title>
  <desc id="desc">A portrait 9:16 source card with the recommended 2160 by 3840 size, connected to a desktop Studio custom image route and a mobile YouTube app frame selection route.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8b70"/>
      <stop offset="1" stop-color="#f15d5b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff2bf"/>
      <stop offset="1" stop-color="#b7dc83"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#152039" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="32" fill="url(#bg)"/>
  <circle cx="1048" cy="82" r="120" fill="#ffe5dd" opacity=".7"/>
  <circle cx="112" cy="624" r="150" fill="#e7f4d4" opacity=".78"/>
  <text x="70" y="75" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#f15d5b">YOUTUBE THUMBNAIL SIZE · SHORTS</text>
  <text x="70" y="124" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#182238">9:16 source, two upload routes</text>
  <text x="70" y="158" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#647188">Keep the file recommendation separate from the product path.</text>

  <g filter="url(#shadow)">
    <rect x="74" y="216" width="270" height="355" rx="24" fill="#17223a"/>
    <rect x="103" y="246" width="212" height="278" rx="12" fill="url(#coral)"/>
    <rect x="126" y="270" width="166" height="98" rx="10" fill="#ffb08f" opacity=".9"/>
    <circle cx="210" cy="319" r="35" fill="#fff2df" opacity=".9"/>
    <path d="M153 444c25-34 89-34 114 0" fill="none" stroke="#fff2df" stroke-width="16" stroke-linecap="round"/>
    <rect x="130" y="472" width="160" height="12" rx="6" fill="#fff2df" opacity=".9"/>
    <text x="209" y="553" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#fff">9:16 portrait source</text>
  </g>
  <text x="209" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#182238">2160 × 3840 recommended</text>
  <text x="209" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#647188">minimum height: 640 px</text>

  <path d="M365 326H425" fill="none" stroke="#f15d5b" stroke-width="5" stroke-linecap="round"/>
  <path d="M412 313l18 13-18 13" fill="none" stroke="#f15d5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M365 486H425" fill="none" stroke="#6fa33c" stroke-width="5" stroke-linecap="round"/>
  <path d="M412 473l18 13-18 13" fill="none" stroke="#6fa33c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="455" y="216" width="650" height="150" rx="24" fill="#fff"/>
    <circle cx="505" cy="266" r="25" fill="url(#green)"/>
    <text x="505" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#466c23">A</text>
    <text x="552" y="258" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#182238">Desktop Studio · Upload file</text>
    <text x="552" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#647188">External JPG/PNG · verified account · computer route</text>
    <rect x="552" y="313" width="228" height="28" rx="14" fill="#e7f4d4"/>
    <text x="666" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#466c23">recommended ratio: 9:16</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="410" width="650" height="150" rx="24" fill="#fff"/>
    <circle cx="505" cy="460" r="25" fill="#ffe5dd"/>
    <text x="505" y="467" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#9d4938">B</text>
    <text x="552" y="452" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#182238">Mobile YouTube app · Select frame</text>
    <text x="552" y="485" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#647188">Frame from the Short · app route · not an external image upload</text>
    <rect x="552" y="507" width="248" height="28" rx="14" fill="#ffe5dd"/>
    <text x="676" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#9d4938">source: video frame</text>
  </g>

  <text x="600" y="637" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#647188">YouTube's Help pages describe the routes separately; a size check cannot create account access.</text>
</svg>
