<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Why a YouTube thumbnail A/B test may have no clear winner</title>
  <desc id="desc">A flow showing a prepared thumbnail test branching to a clear winner, performed same, or inconclusive outcome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#fff8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff765e"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <text x="70" y="70" fill="#172033" font-family="Arial, sans-serif" font-size="27" font-weight="700">A prepared file does not guarantee a clear winner.</text>
  <text x="70" y="103" fill="#66738a" font-family="Arial, sans-serif" font-size="16">YouTube lists more than one valid result for a native thumbnail test.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="280" height="220" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
    <rect x="480" y="180" width="280" height="220" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
    <rect x="870" y="135" width="260" height="120" rx="22" fill="#e9f5ec" stroke="#abd6b5" stroke-width="2"/>
    <rect x="870" y="270" width="260" height="120" rx="22" fill="#fff0e9" stroke="#ffb49f" stroke-width="2"/>
  </g>
  <path d="M365 290H465" stroke="#ff765e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M775 270H840" stroke="#ff765e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M805 300C830 315 835 330 840 340" stroke="#ff765e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g fill="#ff765e" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">
    <text x="100" y="220">01 · PREPARE</text>
    <text x="510" y="220">02 · TEST</text>
    <text x="900" y="175">03 · CLEAR</text>
    <text x="900" y="310">03 · OTHER</text>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="100" y="266">Check the</text>
    <text x="100" y="297">thumbnail files</text>
    <text x="510" y="266">YouTube Studio</text>
    <text x="510" y="297">A/B test</text>
    <text x="900" y="210">Winner</text>
    <text x="900" y="345">Performed Same</text>
    <text x="900" y="375">or Inconclusive</text>
  </g>
  <g fill="#66738a" font-family="Arial, sans-serif" font-size="15">
    <text x="100" y="345">Size is a file condition.</text>
    <text x="100" y="369">It is not a result.</text>
    <text x="510" y="345">The report uses watch</text>
    <text x="510" y="369">time share.</text>
    <text x="900" y="235">Statistical difference</text>
    <text x="900" y="395">No measurable difference</text>
  </g>
  <text x="70" y="500" fill="#66738a" font-family="Arial, sans-serif" font-size="15">Source: YouTube Help, “A/B test titles &amp; thumbnails,” reviewed 2026-10-11.</text>
</svg>
