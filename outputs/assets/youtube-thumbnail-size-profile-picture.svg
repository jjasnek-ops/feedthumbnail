<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">YouTube thumbnail size versus profile picture size</title>
  <desc id="desc">A three-card comparison of the 3840 by 2160 video thumbnail, the square profile picture rendered at 98 by 98, and the profile picture file boundary of 15 megabytes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#26334d"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff795f"/>
      <stop offset="1" stop-color="#f3a15c"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe1c1"/>
      <stop offset="1" stop-color="#d5f1b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#09111f" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <circle cx="1100" cy="70" r="120" fill="#40516f" opacity=".3"/>
  <circle cx="90" cy="620" r="170" fill="#ff795f" opacity=".08"/>
  <text x="70" y="76" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="3">YOUTUBE IMAGE SURFACES</text>
  <text x="70" y="122" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="900">Profile picture size is not thumbnail size.</text>
  <text x="70" y="154" fill="#aebbd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">The profile image is a small identity render, not a 16:9 video preview.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="202" width="330" height="300" rx="24" fill="#f9fbff"/>
    <rect x="94" y="232" width="282" height="158" rx="13" fill="url(#coral)"/>
    <circle cx="318" cy="290" r="39" fill="#14223b" opacity=".78"/>
    <path d="M305 274l28 16-28 16z" fill="#fff"/>
    <path d="M110 366h154" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <text x="94" y="430" fill="#14223b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900">VIDEO THUMBNAIL</text>
    <text x="94" y="459" fill="#4d5b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">3840 × 2160 · 16:9</text>
    <text x="94" y="484" fill="#65748a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Preview for one video</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="202" width="330" height="300" rx="24" fill="#f9fbff"/>
    <rect x="459" y="232" width="282" height="158" rx="13" fill="#162842"/>
    <circle cx="600" cy="311" r="58" fill="url(#mint)"/>
    <circle cx="600" cy="298" r="17" fill="#162842"/>
    <path d="M567 349c8-31 58-31 66 0" fill="#162842"/>
    <text x="459" y="430" fill="#14223b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900">PROFILE PICTURE</text>
    <text x="459" y="459" fill="#4d5b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Renders at 98 × 98</text>
    <text x="459" y="484" fill="#65748a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Square or round · 15 MB max</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="202" width="330" height="300" rx="24" fill="#f9fbff"/>
    <rect x="824" y="232" width="282" height="158" rx="13" fill="#eaf0f7"/>
    <rect x="856" y="258" width="218" height="103" rx="13" fill="#d6e6f0" stroke="#7d8da4" stroke-width="3"/>
    <circle cx="965" cy="309" r="45" fill="none" stroke="#ff795f" stroke-width="4" stroke-dasharray="8 7"/>
    <path d="M900 338h130" stroke="#7d8da4" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="965" y="313" fill="#283951" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="900" text-anchor="middle">CROP + SCALE</text>
    <text x="824" y="430" fill="#14223b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900">PROFILE CONTROL</text>
    <text x="824" y="459" fill="#4d5b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">JPG · GIF · BMP · PNG</text>
    <text x="824" y="484" fill="#65748a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">No animated GIF · publish after crop</text>
  </g>

  <path d="M70 550h1060" stroke="#556681" stroke-width="1" opacity=".7"/>
  <circle cx="80" cy="588" r="8" fill="#ff795f"/>
  <text x="104" y="595" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">A profile picture is channel identity; a thumbnail is a video preview.</text>
  <text x="104" y="625" fill="#aebbd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">98 × 98 describes the render, not a universal upload canvas.</text>
</svg>
