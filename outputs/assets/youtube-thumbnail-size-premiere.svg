<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">YouTube thumbnail and Premiere lifecycle</title>
  <desc id="desc">A diagram showing one 3840 by 2160 thumbnail source flowing through a Premiere landing page, countdown and chat, then becoming a regular upload after the Premiere.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#263555"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff795f"/>
      <stop offset="1" stop-color="#ffb35d"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#91d8ff"/>
      <stop offset="1" stop-color="#b8efcf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#050914" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="32" fill="url(#bg)"/>
  <text x="64" y="68" fill="#eaf1ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">One thumbnail source, several Premiere states</text>
  <text x="64" y="102" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="16">The image dimension belongs to the video file; the event adds pages, timing, and chat.</text>
  <rect x="58" y="145" width="300" height="430" rx="24" fill="#f7f9fc" filter="url(#shadow)"/>
  <text x="86" y="190" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">SOURCE FILE</text>
  <rect x="86" y="222" width="244" height="137" rx="12" fill="url(#thumb)"/>
  <circle cx="270" cy="270" r="38" fill="#ffd178" opacity=".82"/>
  <path d="M86 333 C140 295 170 310 212 284 C258 256 284 294 330 247 L330 359 L86 359Z" fill="#c94d5a" opacity=".58"/>
  <rect x="106" y="249" width="126" height="22" rx="11" fill="#111827" opacity=".9"/>
  <text x="119" y="266" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">VIDEO THUMB</text>
  <text x="86" y="403" fill="#172033" font-family="Arial, sans-serif" font-size="21" font-weight="700">3840 × 2160</text>
  <text x="86" y="432" fill="#5f6c80" font-family="Arial, sans-serif" font-size="15">16:9 · JPG or PNG</text>
  <text x="86" y="475" fill="#5f6c80" font-family="Arial, sans-serif" font-size="14">Upload and Save in Studio</text>
  <text x="86" y="505" fill="#5f6c80" font-family="Arial, sans-serif" font-size="14">One image source</text>
  <line x1="360" y1="360" x2="416" y2="360" stroke="#9ddcff" stroke-width="5" stroke-linecap="round"/>
  <path d="M406 348 L426 360 L406 372" fill="none" stroke="#9ddcff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="430" y="145" width="330" height="430" rx="24" fill="#f7f9fc" filter="url(#shadow)"/>
  <text x="458" y="190" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">PREMIERE PAGE</text>
  <rect x="458" y="222" width="274" height="154" rx="12" fill="#e8f6ff" stroke="#9bdcff" stroke-width="2"/>
  <rect x="480" y="245" width="230" height="92" rx="8" fill="url(#page)"/>
  <path d="M480 320 C538 278 576 316 620 285 C660 257 685 283 710 256 L710 337 L480 337Z" fill="#5f9cba" opacity=".38"/>
  <text x="476" y="406" fill="#172033" font-family="Arial, sans-serif" font-size="17" font-weight="700">Landing page + watch URL</text>
  <text x="458" y="440" fill="#5f6c80" font-family="Arial, sans-serif" font-size="14">thumbnail · reminder · trailer</text>
  <text x="458" y="469" fill="#5f6c80" font-family="Arial, sans-serif" font-size="14">schedule · description · chat</text>
  <text x="458" y="520" fill="#466c23" font-family="Arial, sans-serif" font-size="16" font-weight="700">Before the event</text>
  <line x1="762" y1="360" x2="818" y2="360" stroke="#9ddcff" stroke-width="5" stroke-linecap="round"/>
  <path d="M808 348 L828 360 L808 372" fill="none" stroke="#9ddcff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="832" y="145" width="310" height="430" rx="24" fill="#f7f9fc" filter="url(#shadow)"/>
  <text x="860" y="190" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">EVENT STATES</text>
  <circle cx="884" cy="244" r="18" fill="#ff795f"/>
  <text x="875" y="251" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">1</text>
  <text x="918" y="250" fill="#172033" font-family="Arial, sans-serif" font-size="16" font-weight="700">Countdown</text>
  <circle cx="884" cy="315" r="18" fill="#ff795f"/>
  <text x="875" y="322" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">2</text>
  <text x="918" y="321" fill="#172033" font-family="Arial, sans-serif" font-size="16" font-weight="700">Watch + chat</text>
  <circle cx="884" cy="386" r="18" fill="#ff795f"/>
  <text x="875" y="393" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">3</text>
  <text x="918" y="392" fill="#172033" font-family="Arial, sans-serif" font-size="16" font-weight="700">Regular upload</text>
  <line x1="884" y1="422" x2="884" y2="493" stroke="#b5c1d2" stroke-width="4"/>
  <text x="860" y="475" fill="#5f6c80" font-family="Arial, sans-serif" font-size="14">countdown is not baked</text>
  <text x="860" y="503" fill="#5f6c80" font-family="Arial, sans-serif" font-size="14">into the thumbnail file</text>
  <text x="860" y="545" fill="#466c23" font-family="Arial, sans-serif" font-size="16" font-weight="700">Same source image</text>
</svg>
