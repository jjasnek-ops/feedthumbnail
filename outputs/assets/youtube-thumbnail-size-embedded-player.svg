<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">YouTube thumbnail source, embedded player, and API variants</title>
  <desc id="desc">A diagram separates a 3840 by 2160 source thumbnail, a 480 by 270 recommended embedded player, and API thumbnail variants such as default, medium, standard, and maxres.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cb7ff"/>
      <stop offset="1" stop-color="#507ce8"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9b7c"/>
      <stop offset="1" stop-color="#f15d5b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff2bf"/>
      <stop offset="1" stop-color="#b7dc83"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#152039" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="32" fill="url(#bg)"/>
  <circle cx="1045" cy="92" r="126" fill="#ffe5dd" opacity=".72"/>
  <circle cx="92" cy="614" r="132" fill="#e7f4d4" opacity=".78"/>
  <text x="66" y="70" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#f15d5b">YOUTUBE THUMBNAIL SIZE · EMBED</text>
  <text x="66" y="118" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="800" fill="#182238">Source ≠ player ≠ API image</text>
  <text x="66" y="151" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#647188">Three layers can show three different pixel dimensions.</text>

  <g filter="url(#shadow)">
    <rect x="66" y="205" width="308" height="270" rx="24" fill="#fff"/>
    <text x="98" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#507ce8">1 · SOURCE FILE</text>
    <rect x="98" y="271" width="244" height="137" rx="14" fill="url(#blue)"/>
    <circle cx="220" cy="339" r="30" fill="#dff2ff" opacity=".9"/>
    <path d="M170 389c18-26 82-26 100 0" fill="none" stroke="#dff2ff" stroke-width="12" stroke-linecap="round"/>
    <text x="220" y="443" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#182238">3840 × 2160</text>
    <text x="220" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#647188">video recommendation · 16:9</text>
  </g>

  <path d="M402 340H444" fill="none" stroke="#f15d5b" stroke-width="5" stroke-linecap="round"/>
  <path d="M430 327l18 13-18 13" fill="none" stroke="#f15d5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="468" y="205" width="308" height="270" rx="24" fill="#fff"/>
    <text x="500" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#f15d5b">2 · PLAYER VIEWPORT</text>
    <rect x="500" y="271" width="244" height="137" rx="14" fill="#17223a"/>
    <rect x="517" y="287" width="210" height="105" rx="9" fill="url(#coral)"/>
    <path d="M612 328l30 18-30 18z" fill="#fff" opacity=".9"/>
    <text x="622" y="443" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#182238">480 × 270</text>
    <text x="622" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#647188">recommended 16:9 player</text>
  </g>

  <path d="M804 340H846" fill="none" stroke="#6fa33c" stroke-width="5" stroke-linecap="round"/>
  <path d="M832 327l18 13-18 13" fill="none" stroke="#6fa33c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="870" y="205" width="264" height="270" rx="24" fill="#fff"/>
    <text x="900" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#466c23">3 · API VARIANTS</text>
    <rect x="900" y="275" width="204" height="34" rx="17" fill="#e7f4d4"/>
    <text x="1002" y="297" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#466c23">default · 120 × 90</text>
    <rect x="900" y="321" width="204" height="34" rx="17" fill="#eef4ff"/>
    <text x="1002" y="343" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#507ce8">medium · 320 × 180</text>
    <rect x="900" y="367" width="204" height="34" rx="17" fill="#ffe5dd"/>
    <text x="1002" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#9d4938">standard · 640 × 480</text>
    <text x="1002" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#182238">maxres · 1280 × 720</text>
    <text x="1002" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#647188">availability varies by resource</text>
  </g>

  <rect x="160" y="540" width="880" height="68" rx="22" fill="#17223a" opacity=".96"/>
  <text x="600" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#fff">A smaller player does not change the stored source image.</text>
  <text x="600" y="594" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d9e4ff">Measure the layer that is actually wrong before exporting again.</text>
</svg>
