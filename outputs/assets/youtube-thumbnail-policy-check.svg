<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Separate thumbnail size preparation from YouTube policy review</title>
  <desc id="desc">A three-step diagram showing local image preparation, official policy review, and the product response when custom thumbnail content is considered inappropriate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#fff8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff765e"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <text x="70" y="70" fill="#172033" font-family="Arial, sans-serif" font-size="27" font-weight="700">A correct size is only one part of the handoff.</text>
  <text x="70" y="103" fill="#66738a" font-family="Arial, sans-serif" font-size="16">Prepare the file locally, then read the current policy wording before upload.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="300" height="250" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
    <rect x="450" y="175" width="300" height="250" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
    <rect x="830" y="175" width="300" height="250" rx="24" fill="#fff0e9" stroke="#ffb49f" stroke-width="2"/>
  </g>
  <path d="M385 300H435" stroke="#ff765e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M765 300H815" stroke="#ff765e" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#ff765e" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">
    <text x="100" y="215">01 · LOCAL FILE</text>
    <text x="480" y="215">02 · POLICY REVIEW</text>
    <text x="860" y="215">03 · PRODUCT RESPONSE</text>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="100" y="263">Crop + size</text>
    <text x="100" y="295">preview + export</text>
    <text x="480" y="263">Guidelines</text>
    <text x="480" y="295">categories</text>
    <text x="860" y="263">Turned off</text>
    <text x="860" y="295">or rejected</text>
  </g>
  <g fill="#66738a" font-family="Arial, sans-serif" font-size="15">
    <text x="100" y="341">Feed Thumbnail checks the</text>
    <text x="100" y="365">asset locally in the browser.</text>
    <text x="480" y="341">The official Help page</text>
    <text x="480" y="365">sets the policy boundary.</text>
    <text x="860" y="341">The official answer gives</text>
    <text x="860" y="365">scope, not a prediction.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="100" y="387" width="112" height="25" rx="12" fill="#eaf0ff"/>
    <text x="116" y="405" fill="#405485">browser only</text>
    <rect x="480" y="387" width="132" height="25" rx="12" fill="#eaf0ff"/>
    <text x="496" y="405" fill="#405485">source linked</text>
    <rect x="860" y="387" width="132" height="25" rx="12" fill="#ffd5c9"/>
    <text x="876" y="405" fill="#9b4938">not predictable</text>
  </g>
  <text x="70" y="500" fill="#66738a" font-family="Arial, sans-serif" font-size="15">Sources: current YouTube Help and Feed Thumbnail public source files, reviewed 2026-10-14.</text>
</svg>
