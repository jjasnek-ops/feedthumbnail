<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">YouTube thumbnail size versus end screen rules</title>
  <desc id="desc">A three-card comparison of the 3840 by 2160 video thumbnail, official end-screen timing and element rules, and the local 1920 by 1080 page canvas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#26334d"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff795f"/>
      <stop offset="1" stop-color="#f3a15c"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe1c1"/>
      <stop offset="1" stop-color="#d5f1b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#09111f" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <circle cx="1100" cy="70" r="120" fill="#40516f" opacity=".3"/>
  <circle cx="90" cy="620" r="170" fill="#ff795f" opacity=".08"/>
  <text x="70" y="76" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="3">YOUTUBE VIDEO SURFACES</text>
  <text x="70" y="122" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="900">End screen rules are not thumbnail size.</text>
  <text x="70" y="154" fill="#aebbd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">One is an uploaded preview; the other is a timed interactive layer in Studio.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="202" width="330" height="300" rx="24" fill="#f9fbff"/>
    <rect x="94" y="232" width="282" height="158" rx="13" fill="url(#coral)"/>
    <circle cx="318" cy="290" r="39" fill="#14223b" opacity=".78"/>
    <path d="M305 274l28 16-28 16z" fill="#fff"/>
    <path d="M110 366h154" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <text x="94" y="430" fill="#14223b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900">VIDEO THUMBNAIL</text>
    <text x="94" y="459" fill="#4d5b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">3840 × 2160 · 16:9</text>
    <text x="94" y="484" fill="#65748a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Uploaded preview image</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="202" width="330" height="300" rx="24" fill="#f9fbff"/>
    <rect x="459" y="232" width="282" height="158" rx="13" fill="#162842"/>
    <path d="M487 260h226v103H487z" fill="none" stroke="#7d8da4" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="515" y="276" width="67" height="45" rx="8" fill="url(#mint)"/>
    <rect x="596" y="294" width="67" height="45" rx="8" fill="#ff795f"/>
    <circle cx="683" cy="326" r="23" fill="#d6e6f0"/>
    <path d="M487 374h226" stroke="#ff795f" stroke-width="4" stroke-linecap="round"/>
    <text x="459" y="430" fill="#14223b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900">END SCREEN RULES</text>
    <text x="459" y="459" fill="#4d5b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">5–20 seconds · up to 4</text>
    <text x="459" y="484" fill="#65748a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Video at least 25 seconds</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="202" width="330" height="300" rx="24" fill="#f9fbff"/>
    <rect x="824" y="232" width="282" height="158" rx="13" fill="#eaf0f7"/>
    <rect x="856" y="258" width="218" height="103" rx="13" fill="#d6e6f0" stroke="#7d8da4" stroke-width="3"/>
    <rect x="892" y="276" width="68" height="38" rx="8" fill="url(#mint)"/>
    <rect x="979" y="304" width="58" height="34" rx="8" fill="#ff795f"/>
    <path d="M856 374h218" stroke="#7d8da4" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="965" y="430" fill="#14223b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="900" text-anchor="middle">LOCAL TEMPLATE</text>
    <text x="965" y="459" fill="#4d5b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">1920 × 1080 · 16:9</text>
    <text x="965" y="484" fill="#65748a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">Page specification · PNG export</text>
  </g>

  <path d="M70 550h1060" stroke="#556681" stroke-width="1" opacity=".7"/>
  <circle cx="80" cy="588" r="8" fill="#ff795f"/>
  <text x="104" y="595" fill="#f5f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">A thumbnail is an upload; an end screen is a timed editor layer.</text>
  <text x="104" y="625" fill="#aebbd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">1920 × 1080 is a local template choice, not an official end-screen file requirement.</text>
</svg>
