<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Thumbnail image versus YouTube info card</title>
  <desc id="desc">A split diagram. The left panel shows a 3840 by 2160 thumbnail image file. The right panel shows an info card as a timeline object with a destination, start time, teaser, and no published pixel canvas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#233354"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff795f"/>
      <stop offset="1" stop-color="#ffb35d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89d2ff"/>
      <stop offset="1" stop-color="#a8f0d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#050914" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="32" fill="url(#bg)"/>
  <text x="64" y="70" fill="#eaf1ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Two YouTube jobs, two evidence types</text>
  <text x="64" y="104" fill="#9fb0c9" font-family="Arial, sans-serif" font-size="16">A thumbnail has an image source. An info card has an interactive destination and time.</text>
  <rect x="58" y="146" width="500" height="446" rx="24" fill="#f7f9fc" filter="url(#shadow)"/>
  <rect x="88" y="180" width="440" height="248" rx="14" fill="url(#thumb)"/>
  <path d="M88 378 C180 300 230 320 300 278 C380 230 442 274 528 202 L528 428 L88 428Z" fill="#cc4c58" opacity=".55"/>
  <circle cx="424" cy="252" r="66" fill="#ffd178" opacity=".8"/>
  <rect x="118" y="238" width="220" height="36" rx="18" fill="#111827" opacity=".9"/>
  <text x="140" y="263" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">THUMBNAIL FILE</text>
  <text x="88" y="475" fill="#172033" font-family="Arial, sans-serif" font-size="25" font-weight="700">3840 × 2160 · 16:9</text>
  <text x="88" y="508" fill="#5f6c80" font-family="Arial, sans-serif" font-size="16">JPG or PNG · uploaded preview image</text>
  <text x="88" y="545" fill="#5f6c80" font-family="Arial, sans-serif" font-size="16">Check pixels, format, bytes, crop, and Save.</text>
  <rect x="642" y="146" width="500" height="446" rx="24" fill="#f7f9fc" filter="url(#shadow)"/>
  <text x="680" y="198" fill="#172033" font-family="Arial, sans-serif" font-size="25" font-weight="700">INFO CARD OBJECT</text>
  <text x="680" y="230" fill="#5f6c80" font-family="Arial, sans-serif" font-size="16">No published card image canvas</text>
  <rect x="680" y="266" width="424" height="92" rx="14" fill="#e8f6ff" stroke="#9bdcff" stroke-width="2"/>
  <circle cx="724" cy="312" r="22" fill="#1c8cca"/>
  <text x="716" y="320" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">i</text>
  <text x="764" y="303" fill="#172033" font-family="Arial, sans-serif" font-size="17" font-weight="700">Destination: video / playlist / channel</text>
  <text x="764" y="331" fill="#5f6c80" font-family="Arial, sans-serif" font-size="15">or eligible external link</text>
  <line x1="704" y1="420" x2="1080" y2="420" stroke="#b5c1d2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="816" cy="420" r="11" fill="#ff795f"/>
  <text x="680" y="467" fill="#172033" font-family="Arial, sans-serif" font-size="18" font-weight="700">Start time</text>
  <text x="680" y="496" fill="#5f6c80" font-family="Arial, sans-serif" font-size="15">teaser · message · Save</text>
  <text x="680" y="542" fill="#466c23" font-family="Arial, sans-serif" font-size="17" font-weight="700">Up to 5 cards per video</text>
  <text x="680" y="570" fill="#5f6c80" font-family="Arial, sans-serif" font-size="15">Check viewer surface, rights, and audience rules.</text>
</svg>
