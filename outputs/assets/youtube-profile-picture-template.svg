<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Editable square YouTube profile picture starter template</title>
  <desc id="desc">A self-generated square SVG starter with editable headline, background, accent, and circular crop guide layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11182b"/>
      <stop offset="1" stop-color="#334d83"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#d8ff5a" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#d8ff5a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background">
    <rect width="100" height="100" fill="url(#bg)"/>
    <rect width="100" height="100" fill="url(#glow)"/>
  </g>
  <g id="accent" fill="none" stroke="#d8ff5a" stroke-width="0.8" opacity="0.8">
    <path d="M8 0V100M0 8H100" stroke-opacity="0.18"/>
    <circle cx="78" cy="20" r="13" stroke-opacity="0.45"/>
    <circle cx="78" cy="20" r="8" stroke-opacity="0.28"/>
  </g>
  <g id="circle-crop-guide" fill="none" stroke="#d8ff5a" stroke-width="0.7" stroke-dasharray="2.4 1.8">
    <circle cx="50" cy="50" r="34"/>
  </g>
  <g id="headline" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="50" y="48" fill="#ffffff" font-size="7.2" font-weight="700" letter-spacing="0.24">YOUR NAME</text>
    <text x="50" y="57" fill="#d8ff5a" font-size="3" font-weight="700" letter-spacing="0.35">REPLACE THIS TEXT</text>
  </g>
  <g id="labels" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" opacity="0.78">
    <text x="50" y="10" font-size="2.2" font-weight="700" letter-spacing="0.28">CIRCLE CROP GUIDE</text>
    <text x="50" y="94" font-size="2.1" letter-spacing="0.25">EDITABLE SQUARE STARTER TEMPLATE</text>
  </g>
</svg>
