<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">A YouTube thumbnail A/B test has separate file preparation and winner measurement steps</title>
  <desc id="desc">A flow from checking a thumbnail file locally, to running the experiment in YouTube Studio, to reading the watch time result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#fff8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff765e"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <text x="70" y="72" fill="#172033" font-family="Arial, sans-serif" font-size="27" font-weight="700">Prepare the file locally. Read the winner in Studio.</text>
  <text x="70" y="105" fill="#66738a" font-family="Arial, sans-serif" font-size="16">The thumbnail canvas and the experiment metric answer different questions.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="170" width="300" height="250" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
    <rect x="450" y="170" width="300" height="250" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
    <rect x="830" y="170" width="300" height="250" rx="24" fill="#fff0e9" stroke="#ffb49f" stroke-width="2"/>
  </g>
  <path d="M385 294H435" stroke="#ff765e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M765 294H815" stroke="#ff765e" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#ff765e" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">
    <text x="100" y="214">01 · LOCAL CHECK</text>
    <text x="480" y="214">02 · EXPERIMENT</text>
    <text x="860" y="214">03 · RESULT</text>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="100" y="260">Canvas + file</text>
    <text x="100" y="291">dimensions</text>
    <text x="480" y="260">YouTube Studio</text>
    <text x="480" y="291">A/B test</text>
    <text x="860" y="260">Overall watch</text>
    <text x="860" y="291">time</text>
  </g>
  <g fill="#66738a" font-family="Arial, sans-serif" font-size="15">
    <text x="100" y="335">Feed Thumbnail can show</text>
    <text x="100" y="359">the local preview and export.</text>
    <text x="480" y="335">Only the native test can</text>
    <text x="480" y="359">measure the experiment.</text>
    <text x="860" y="335">YouTube says the native</text>
    <text x="860" y="359">test is optimized beyond CTR.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="100" y="378" width="118" height="25" rx="12" fill="#eaf0ff"/>
    <text x="116" y="396" fill="#405485">file evidence</text>
    <rect x="480" y="378" width="127" height="25" rx="12" fill="#eaf0ff"/>
    <text x="496" y="396" fill="#405485">Studio only</text>
    <rect x="860" y="378" width="146" height="25" rx="12" fill="#ffd5c9"/>
    <text x="876" y="396" fill="#9b4938">watch time</text>
  </g>
  <text x="70" y="500" fill="#66738a" font-family="Arial, sans-serif" font-size="15">Source: YouTube Help, “A/B test titles &amp; thumbnails,” reviewed 2026-10-10.</text>
</svg>
