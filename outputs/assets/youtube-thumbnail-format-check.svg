<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">A scoped YouTube thumbnail format check for GIF, JPG, and PNG</title>
  <desc id="desc">A three-step diagram showing the current official format wording, the Feed Thumbnail input formats, and the local export formats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#fff8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff765e"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <text x="70" y="70" fill="#172033" font-family="Arial, sans-serif" font-size="27" font-weight="700">Format guidance needs a scope check.</text>
  <text x="70" y="103" fill="#66738a" font-family="Arial, sans-serif" font-size="16">The official wording and this site's local file path are separate pieces of evidence.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="300" height="250" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
    <rect x="450" y="175" width="300" height="250" rx="24" fill="#ffffff" stroke="#dbe3f0" stroke-width="2"/>
    <rect x="830" y="175" width="300" height="250" rx="24" fill="#fff0e9" stroke="#ffb49f" stroke-width="2"/>
  </g>
  <path d="M385 300H435" stroke="#ff765e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M765 300H815" stroke="#ff765e" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#ff765e" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">
    <text x="100" y="215">01 · OFFICIAL PAGE</text>
    <text x="480" y="215">02 · LOCAL INPUT</text>
    <text x="860" y="215">03 · LOCAL EXPORT</text>
  </g>
  <g fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="100" y="263">JPG or PNG</text>
    <text x="100" y="295">wording checked</text>
    <text x="480" y="263">PNG · JPEG</text>
    <text x="480" y="295">· WEBP</text>
    <text x="860" y="263">PNG preview</text>
    <text x="860" y="295">JPEG resize</text>
  </g>
  <g fill="#66738a" font-family="Arial, sans-serif" font-size="15">
    <text x="100" y="341">The checked page does not</text>
    <text x="100" y="365">mention GIF in this list.</text>
    <text x="480" y="341">The homepage file input</text>
    <text x="480" y="365">does not accept GIF.</text>
    <text x="860" y="341">The public scripts create</text>
    <text x="860" y="365">static image downloads.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="100" y="387" width="123" height="25" rx="12" fill="#eaf0ff"/>
    <text x="116" y="405" fill="#405485">current scope</text>
    <rect x="480" y="387" width="98" height="25" rx="12" fill="#eaf0ff"/>
    <text x="496" y="405" fill="#405485">HTML input</text>
    <rect x="860" y="387" width="119" height="25" rx="12" fill="#ffd5c9"/>
    <text x="876" y="405" fill="#9b4938">browser output</text>
  </g>
  <text x="70" y="500" fill="#66738a" font-family="Arial, sans-serif" font-size="15">Sources: YouTube Help and Feed Thumbnail public source files, reviewed 2026-10-12.</text>
</svg>
