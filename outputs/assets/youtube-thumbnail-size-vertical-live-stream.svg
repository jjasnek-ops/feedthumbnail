<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">YouTube thumbnail source and vertical live layout</title>
  <desc id="desc">A source thumbnail card at 3840 by 2160 feeds horizontal and vertical live layouts. The vertical layout can center crop, fit to phone width, or stack. The bottom row names the surfaces where viewers see the stream.</desc>
  <rect width="1200" height="700" rx="32" fill="#f8fafc"/>
  <rect x="36" y="32" width="1128" height="636" rx="26" fill="#ffffff" stroke="#dce2eb" stroke-width="2"/>
  <text x="72" y="84" fill="#17223a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Source file → live layout → viewer surface</text>
  <text x="72" y="115" fill="#68758a" font-family="Arial, Helvetica, sans-serif" font-size="16">A 9:16 live presentation is not proof of a separate 9:16 thumbnail upload rule.</text>

  <rect x="72" y="154" width="330" height="270" rx="20" fill="#17223a"/>
  <rect x="98" y="188" width="278" height="156" rx="8" fill="#ff795f"/>
  <rect x="115" y="205" width="244" height="122" rx="6" fill="#ffd5c9"/>
  <rect x="142" y="226" width="62" height="80" rx="30" fill="#ff795f"/>
  <circle cx="173" cy="239" r="16" fill="#17223a"/>
  <rect x="224" y="230" width="104" height="11" rx="5" fill="#17223a"/>
  <rect x="224" y="252" width="80" height="11" rx="5" fill="#17223a" opacity=".7"/>
  <text x="98" y="377" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Custom source</text>
  <text x="98" y="403" fill="#dce6f5" font-family="Arial, Helvetica, sans-serif" font-size="16">3840 × 2160 · 16:9</text>

  <path d="M426 288h54" stroke="#ff795f" stroke-width="4" stroke-linecap="round"/>
  <path d="m466 274 20 14-20 14" fill="none" stroke="#ff795f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="510" y="154" width="260" height="270" rx="20" fill="#eef5ff" stroke="#cfe0f5"/>
  <rect x="538" y="188" width="204" height="115" rx="8" fill="#bfd9f4" stroke="#4f79a8" stroke-width="2"/>
  <rect x="559" y="204" width="162" height="83" rx="4" fill="#ffd5c9"/>
  <rect x="580" y="218" width="42" height="55" rx="20" fill="#ff795f"/>
  <rect x="638" y="222" width="60" height="9" rx="4" fill="#17223a"/>
  <rect x="638" y="241" width="44" height="9" rx="4" fill="#17223a" opacity=".7"/>
  <text x="538" y="345" fill="#17223a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Horizontal live</text>
  <text x="538" y="372" fill="#52647c" font-family="Arial, Helvetica, sans-serif" font-size="15">16:9 broadcast</text>
  <text x="538" y="399" fill="#52647c" font-family="Arial, Helvetica, sans-serif" font-size="14">computer · TV · watch page</text>

  <path d="M794 288h54" stroke="#ff795f" stroke-width="4" stroke-linecap="round"/>
  <path d="m834 274 20 14-20 14" fill="none" stroke="#ff795f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="878" y="154" width="248" height="270" rx="20" fill="#fff1eb" stroke="#f7c7b9"/>
  <rect x="969" y="185" width="66" height="118" rx="10" fill="#ffffff" stroke="#ff795f" stroke-width="3"/>
  <rect x="978" y="199" width="48" height="91" rx="5" fill="#ffd5c9"/>
  <rect x="990" y="214" width="24" height="57" rx="12" fill="#ff795f"/>
  <rect x="1018" y="218" width="3" height="46" rx="1" fill="#17223a" opacity=".65"/>
  <text x="902" y="345" fill="#17223a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Vertical live</text>
  <text x="902" y="372" fill="#9d4938" font-family="Arial, Helvetica, sans-serif" font-size="15">9:16 presentation</text>
  <text x="902" y="399" fill="#9d4938" font-family="Arial, Helvetica, sans-serif" font-size="14">crop · fit · stacked</text>

  <line x1="72" y1="464" x2="1128" y2="464" stroke="#dce2eb" stroke-width="2"/>
  <text x="72" y="505" fill="#68758a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">VIEWER SURFACES</text>
  <rect x="72" y="528" width="300" height="74" rx="14" fill="#f4f8fc"/>
  <text x="94" y="558" fill="#17223a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Mobile Shorts feed</text>
  <text x="94" y="582" fill="#68758a" font-family="Arial, Helvetica, sans-serif" font-size="14">vertical version may appear</text>
  <rect x="392" y="528" width="300" height="74" rx="14" fill="#f4f8fc"/>
  <text x="414" y="558" fill="#17223a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Watch page / TV</text>
  <text x="414" y="582" fill="#68758a" font-family="Arial, Helvetica, sans-serif" font-size="14">horizontal version may appear</text>
  <rect x="712" y="528" width="416" height="74" rx="14" fill="#17223a"/>
  <text x="736" y="558" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Check the layer before exporting again</text>
  <text x="736" y="582" fill="#dce6f5" font-family="Arial, Helvetica, sans-serif" font-size="14">source · crop · surface · timing</text>
</svg>
